# Gradle / Android build settings for the containerized local build.
#
# Memory is kept conservative because the Docker Desktop VM is limited (~7.7 GiB
# on this M1 host) and an over-large Gradle/Kotlin/worker set can be OOM-killed
# mid-build. Parallelism is off (single-module build) and the Kotlin compiler runs
# in-process to avoid spawning a second large JVM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=2

kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
